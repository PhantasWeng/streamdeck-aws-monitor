name: Release

# 推送符合 v* 的 tag 時（例如 v1.0.0.0）自動打包並建立 GitHub Release
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write # 建立 Release 需要寫入權限

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # generate-notes.mjs 需要完整歷史與所有 tags 才能定位前一個 tag 的區間
          fetch-depth: 0

      # 改用 @napi-rs/canvas（靜態連結預編譯 binary），不需系統函式庫或原始碼編譯。
      # 各平台 binary 由 scripts/copy-canvas.mjs 於封裝前抓取並打包（見下方 Bundle canvas 步驟）。

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Run tests
        run: yarn test

      # tag 名去掉開頭的 v 即為外掛版本（v1.0.0.0 -> 1.0.0.0）
      - name: Derive version from tag
        id: version
        run: echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      # 從 CHANGELOG.md 抽出該版本區塊作為 Release note；
      # 抽不到則改由「前一個 tag..本 tag」的 git log 直接產生（generate-notes.mjs）
      - name: Prepare release notes
        id: notes
        run: |
          {
            node scripts/extract-notes.mjs "${{ steps.version.outputs.value }}" > release-notes.md ||
            node scripts/generate-notes.mjs "$GITHUB_REF_NAME" > release-notes.md
          } || true
          if [ -s release-notes.md ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build bundle
        run: yarn build:bundle

      # 將 @napi-rs/canvas 與各平台 binary（macOS arm64/x64、Windows x64）
      # 複製進外掛 node_modules，讓封裝包自帶 canvas 而不依賴使用者環境。
      - name: Bundle canvas into plugin
        run: node scripts/copy-canvas.mjs

      - name: Pack plugin
        run: |
          yarn streamdeck pack \
            ./com.phantas-weng.aws-monitor.sdPlugin \
            --version "${{ steps.version.outputs.value }}" \
            -o dist \
            -f

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES_FOUND: ${{ steps.notes.outputs.found }}
        run: |
          # note 來源：優先用 CHANGELOG 抽出的區塊（--notes-file），抽不到才 fallback 到 GitHub 自動生成
          if [ "$NOTES_FOUND" = "true" ]; then
            NOTES_ARGS=(--notes-file release-notes.md)
          else
            NOTES_ARGS=(--generate-notes)
          fi

          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            # Release 已存在（例如重跑）→ 覆蓋 asset 並更新 note
            gh release upload "$GITHUB_REF_NAME" dist/*.streamDeckPlugin --clobber
            if [ "$NOTES_FOUND" = "true" ]; then
              gh release edit "$GITHUB_REF_NAME" --notes-file release-notes.md
            fi
          else
            gh release create "$GITHUB_REF_NAME" \
              dist/*.streamDeckPlugin \
              --title "$GITHUB_REF_NAME" \
              "${NOTES_ARGS[@]}"
          fi
