name: Release

# 推送符合 v* 的 tag 時（例如 v1.0.0.0）自動打包並建立 GitHub Release
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write # 建立 Release 需要寫入權限

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # canvas 為原生模組，安裝時可能需要從原始碼編譯，先備妥系統相依
      - name: Install canvas build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            libcairo2-dev \
            libpango1.0-dev \
            libjpeg-dev \
            libgif-dev \
            librsvg2-dev

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Run tests
        run: yarn test

      # tag 名去掉開頭的 v 即為外掛版本（v1.0.0.0 -> 1.0.0.0）
      - name: Derive version from tag
        id: version
        run: echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      # 從 CHANGELOG.md 抽出該版本區塊作為 Release note；抽不到則留空由後續 fallback 處理
      - name: Extract release notes from CHANGELOG
        id: notes
        run: |
          node scripts/extract-notes.mjs "${{ steps.version.outputs.value }}" > release-notes.md || true
          if [ -s release-notes.md ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build bundle
        run: yarn build:bundle

      - name: Pack plugin
        run: |
          yarn streamdeck pack \
            ./com.phantas-weng.aws-monitor.sdPlugin \
            --version "${{ steps.version.outputs.value }}" \
            -o dist \
            -f

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES_FOUND: ${{ steps.notes.outputs.found }}
        run: |
          # note 來源：優先用 CHANGELOG 抽出的區塊（--notes-file），抽不到才 fallback 到 GitHub 自動生成
          if [ "$NOTES_FOUND" = "true" ]; then
            NOTES_ARGS=(--notes-file release-notes.md)
          else
            NOTES_ARGS=(--generate-notes)
          fi

          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            # Release 已存在（例如重跑）→ 覆蓋 asset 並更新 note
            gh release upload "$GITHUB_REF_NAME" dist/*.streamDeckPlugin --clobber
            if [ "$NOTES_FOUND" = "true" ]; then
              gh release edit "$GITHUB_REF_NAME" --notes-file release-notes.md
            fi
          else
            gh release create "$GITHUB_REF_NAME" \
              dist/*.streamDeckPlugin \
              --title "$GITHUB_REF_NAME" \
              "${NOTES_ARGS[@]}"
          fi
